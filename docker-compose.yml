services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_cex
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: cex
    volumes:
      - db_storage:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d cex"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis_cex
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: api_cex
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    environment:
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt/jwt-private.pem
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt/jwt-public.pem
    volumes:
      - ./secrets:/run/secrets/jwt:ro

  order_engine:
    build:
      context: .
      dockerfile: order_engine/Dockerfile
    container_name: order_engine_cex
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://admin:supersecretpassword@postgres:5432/cex
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    container_name: client_cex
    ports:
      - "3001:3001"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db_storage:
    driver: local
