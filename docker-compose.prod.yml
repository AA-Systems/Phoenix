services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: api_cex
    env_file:
      - .env
    volumes:
      - /etc/centralized-exchange/secrets:/run/secrets/jwt:ro
    environment:
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt/jwt-private.pem
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt/jwt-public.pem
    ports:
      - "3000:3000"
    restart: unless-stopped

  order_engine:
    build:
      context: .
      dockerfile: order_engine/Dockerfile
    container_name: order_engine_cex
    env_file:
      - .env
    restart: unless-stopped

  ws_server:
    build:
      context: .
      dockerfile: ws_server/Dockerfile
    container_name: ws_server_cex
    env_file:
      - .env
    volumes:
      - /etc/centralized-exchange/secrets:/run/secrets/jwt:ro
    ports:
      - "3002:3002"
    restart: unless-stopped

  candle_builder:
    build:
      context: .
      dockerfile: candle_builder/Dockerfile
    container_name: candle_builder_cex
    env_file:
      - .env
    restart: unless-stopped

  demo_bot:
    build:
      context: .
      dockerfile: demo_bot/Dockerfile
    container_name: demo_bot_cex
    env_file:
      - .env
    restart: unless-stopped
    profiles:
      - demo

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: client_cex
    ports:
      - "3001:3001"
    depends_on:
      - api
    restart: unless-stopped
