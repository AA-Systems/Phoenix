services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: api_cex
    env_file:
      - .env
    volumes:
      - /etc/centralized-exchange/secrets:/run/secrets/jwt:ro
    environment:
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt/jwt-private.pem
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt/jwt-public.pem
    ports:
      - "3000:3000"
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: client_cex
    ports:
      - "3001:3001"
    depends_on:
      - api
    restart: unless-stopped
