[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { path = '../common' }
dotenv = "0.15.0"
axum = "0.8.9"
tokio = { version = "1.52.3", features = ["rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "any", "postgres", "tls-rustls"] }
tower = "0.5.3"
tower-http = {version = "0.6.11", features = ["cors"]}
