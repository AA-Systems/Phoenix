[package]
name = "order_engine"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
dotenv = "0.15.0"
redis = { version = "0.32.5", features = ["tokio-comp", "connection-manager"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
types = { path = "../types" }
uuid = { version = "1.23.5", features = ["v4"] }
